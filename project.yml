# Source of truth for the Xcode project. Regenerate with `xcodegen generate`.
# The .xcodeproj is a build artifact and is not checked in.
name: Tsubame

options:
  bundleIdPrefix: dev.kakushin
  createIntermediateGroups: true
  deploymentTarget:
    # Provisional per PRD §10, pending a real compatibility review.
    iOS: "17.0"
    macOS: "14.0"
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  KubeKit:
    path: KubeKit
  CodeEditorView:
    url: https://github.com/mchakravarty/CodeEditorView.git
    revision: 2394a48f919d6570cfbfbd53d047a3eaeb95b59e

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Ad-hoc signing so the project builds and runs on a Mac and in the
    # Simulator with no Apple developer team configured. Device builds and
    # distribution need a real team: set DEVELOPMENT_TEAM and switch
    # CODE_SIGN_STYLE to Automatic locally.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    DEAD_CODE_STRIPPING: YES

targets:
  Tsubame:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - LaunchScreen.storyboard
      - path: App/Resources/LaunchScreen.storyboard
        destinationFilters: [iOS]
    dependencies:
      - package: CodeEditorView
        product: CodeEditorView
      - package: CodeEditorView
        product: LanguageSupport
      - package: KubeKit
        product: KubeKit
      - package: KubeKit
        product: KubeKeychain
      - package: KubeKit
        product: KubeModels
      # Everything inside KubeExec is behind `#if os(macOS)`, so the iOS build
      # links an empty module rather than reaching a `Process` it cannot use.
      - package: KubeKit
        product: KubeExec
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kakushin.tsubame
        # Overrides XcodeGen's "iPhone Developer" default for app targets.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        PROVISIONING_PROFILE_SPECIFIER: ""
        PRODUCT_NAME: Tsubame
        INFOPLIST_FILE: App/Resources/Info.plist
        # Merge the generated iOS scene/launch keys below with the shared plist.
        # Without this, iOS uses the legacy letterboxed launch size.
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        # No entitlements file: the App Sandbox is off, which is what lets macOS
        # read ~/.kube/config directly (PRD §9.1). Adding entitlements requires a
        # signing team, so sandboxing is deferred to the distribution decision.
        # The app holds no background modes: watches and logs are foreground-only
        # on iOS and iPadOS (PRD §10).
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        "INFOPLIST_KEY_UILaunchStoryboardName[sdk=iphone*]": LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools

  TsubameTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Tests
    dependencies:
      - target: Tsubame
      - package: KubeKit
        product: KubeTestSupport
      - package: KubeKit
        product: KubeKeychain
      - package: KubeKit
        product: KubeKit
      - package: KubeKit
        product: KubeModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kakushin.tsubame.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        PROVISIONING_PROFILE_SPECIFIER: ""
        GENERATE_INFOPLIST_FILE: YES
        # The host executable sits at a different path in a macOS bundle than in
        # an iOS one, so the multiplatform test target needs both spellings.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Tsubame.app/Contents/MacOS/Tsubame"
        "TEST_HOST[sdk=iphoneos*]": "$(BUILT_PRODUCTS_DIR)/Tsubame.app/Tsubame"
        "TEST_HOST[sdk=iphonesimulator*]": "$(BUILT_PRODUCTS_DIR)/Tsubame.app/Tsubame"

schemes:
  Tsubame:
    build:
      targets:
        Tsubame: all
        TsubameTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TsubameTests
